<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sticker 5 · @odontologiapaulaquiroz</title>
<link rel="stylesheet" href="base.css">
<style>
  .pill { top: 180px; height: 140px; background: var(--marino); }
  .hairline { left: 25px; right: 25px; top: 195px; height: 110px; border-radius: 999px; border-color: rgba(201, 168, 76, 0.55); }
  .row {
    position: absolute; left: 0; right: 0; top: 180px; height: 140px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .heart { width: 44px; height: 44px; display: block; animation: beat 1s infinite both; }
  /* Doble latido por segundo (dos ciclos en el loop de 2 s) */
  @keyframes beat {
    0%   { transform: scale(1); animation-timing-function: ease-out; }
    12%  { transform: scale(1.24); animation-timing-function: ease-in; }
    24%  { transform: scale(0.98); animation-timing-function: ease-out; }
    36%  { transform: scale(1.14); animation-timing-function: ease-in-out; }
    56%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  .handle {
    color: var(--blanco);
    font-family: 'Montserrat', sans-serif; font-weight: 600;
    font-size: 25px; letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="pill"></div>
  <div class="hairline"></div>
  <div class="row">
    <svg class="heart" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E2C77A"/>
          <stop offset="0.5" stop-color="#C9A84C"/>
          <stop offset="1" stop-color="#B8913F"/>
        </linearGradient>
      </defs>
      <path fill="url(#hg)" d="M12 21.2C11.6 21.2 11.2 21 10.9 20.8 6.1 16.6 2 13.1 2 8.6 2 5.5 4.4 3.2 7.4 3.2c1.8 0 3.5.9 4.6 2.3 1.1-1.4 2.8-2.3 4.6-2.3 3 0 5.4 2.3 5.4 5.4 0 4.5-4.1 8-8.9 12.2-.3.2-.7.4-1.1.4z"/>
      <path fill="#FFF4D2" opacity="0.7" d="M6.2 6.2c-1.3.4-2.1 1.6-2.1 2.9 0 .4.5.5.7.2.4-.9 1-1.6 1.9-2 .5-.3.1-1.3-.5-1.1z"/>
    </svg>
    <div class="handle">@odontologiapaulaquiroz</div>
  </div>
</div>
</body>
</html>
