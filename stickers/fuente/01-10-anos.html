<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sticker 1 · 10 años</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Brillo que recorre el aro: degradado cónico recortado al ancho del borde */
  .ring-shine {
    position: absolute; inset: 10px; border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg 290deg,
      rgba(243, 226, 174, 0) 290deg,
      #E8D08A 318deg, #FFF6DC 334deg, #E8D08A 348deg,
      rgba(243, 226, 174, 0) 360deg);
    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - var(--borde)), #000 calc(100% - var(--borde) + 0.5px));
            mask: radial-gradient(closest-side, transparent calc(100% - var(--borde)), #000 calc(100% - var(--borde) + 0.5px));
    animation: spin 2s linear infinite;
  }
  .hairline { inset: 30px; border-radius: 50%; }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--marino);
  }
  .num {
    font-family: 'Cinzel', serif; font-weight: 600;
    font-size: 228px; line-height: 0.8; letter-spacing: -0.01em;
    margin-top: 18px;
  }
  .anos {
    display: flex; align-items: center; gap: 16px;
    font-family: 'Montserrat', sans-serif; font-weight: 600;
    font-size: 34px; letter-spacing: 0.42em;
    margin-top: 22px;
  }
  .anos .t { margin-right: -0.42em; }
  .rule { width: 36px; height: 2.5px; background: var(--dorado); }
</style>
</head>
<body>
<div class="stage">
  <div class="disk"></div>
  <div class="ring-shine"></div>
  <div class="hairline"></div>
  <div class="content">
    <div class="num">10</div>
    <div class="anos"><span class="rule"></span><span class="t">AÑOS</span><span class="rule"></span></div>
  </div>
  <div class="sparkle" style="--x:378px; --y:128px; --s:70px; --d:calc(0.15s - 2s)"></div>
  <div class="sparkle" style="--x:112px; --y:300px; --s:50px; --d:calc(0.85s - 2s)"></div>
  <div class="sparkle" style="--x:150px; --y:118px; --s:36px; --d:calc(1.4s - 2s)"></div>
</div>
<script src="sparkle.js"></script>
</body>
</html>
