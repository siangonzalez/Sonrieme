<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sticker 3 · Creando sonrisas</title>
<link rel="stylesheet" href="base.css">
<style>
  .pill { top: 145px; height: 210px; background: var(--blanco); }
  .hairline { left: 26px; right: 26px; top: 161px; height: 178px; border-radius: 999px; }
  .content {
    position: absolute; left: 0; right: 0; top: 145px; height: 210px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .text {
    text-align: center; color: var(--marino);
    font-family: 'Cinzel', serif; font-weight: 600;
    font-size: 29px; line-height: 1.34; white-space: nowrap;
  }
  .uwrap { position: relative; width: 300px; height: 16px; margin-top: 10px; }
  .uwrap svg { display: block; }
  .uwrap path {
    fill: none; stroke: url(#ug); stroke-width: 4.5; stroke-linecap: round;
    stroke-dasharray: 100 100;
    animation: draw 2s infinite both;
  }
  /* Se dibuja de izquierda a derecha, se sostiene y se recoge hacia la derecha */
  @keyframes draw {
    0%   { stroke-dashoffset: 100; }
    6%   { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.5, 0, .3, 1); }
    42%  { stroke-dashoffset: 0; }
    80%  { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(.6, 0, .6, 1); }
    97%  { stroke-dashoffset: -100; }
    100% { stroke-dashoffset: -100; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="pill"></div>
  <div class="hairline"></div>
  <div class="content">
    <div class="text">Creando sonrisas,<br>construyendo historias</div>
    <div class="uwrap">
      <svg width="300" height="16" viewBox="0 0 300 16">
        <defs>
          <linearGradient id="ug" x1="0" x2="1">
            <stop offset="0" stop-color="#B8913F"/>
            <stop offset="0.5" stop-color="#C9A84C"/>
            <stop offset="1" stop-color="#B8913F"/>
          </linearGradient>
        </defs>
        <path pathLength="100" d="M4 11 C 80 4, 220 4, 296 11"/>
      </svg>
      <div class="sparkle" style="--x:298px; --y:10px; --s:36px; --d:calc(0.72s - 2s)"></div>
    </div>
  </div>
</div>
<script src="sparkle.js"></script>
</body>
</html>
